server.port=8080
spring.application.name=medicare-plus

# ---- MySQL (default) -------------------------------------------------
# The database is created automatically if it does not exist.
# Override with environment variables: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/medicare_plus?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# Tables are created/updated from the entities. database/schema.sql is the same schema for manual setup.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Origins allowed to call the API (comma separated). * is fine for local development.
app.cors.allowed-origins=*
